name: Build EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PythonGames/Doompy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ursina pyinstaller
      - run: pyinstaller --onefile --noconsole --name DoomPython --add-data "assets;assets" --collect-all ursina --collect-all panda3d main.py
      - uses: actions/upload-artifact@v4
        with:
          name: doom-python-exe
          path: PythonGames/Doompy/dist/DoomPython.exe
